<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schol Managment Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:  linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.6)),
                  url("https://www.nilkamaledge.com/cdn/shop/articles/Enhancing_Classroom_Comfort_Why_Nilkamal_Edge_Benches_and_Chairs_are_the_Best_Choice_1.jpg?v=1723195524") 
                  no-repeat center center/cover;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      text-align: center;
    }

    .box {
      background: rgba(170, 182, 182, 0.6);
      border: 2px solid rgb(110, 111, 111);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 0 20px rgb(130, 177, 177);
    }

    .box h2 {
      color: rgb(18, 20, 22);
      margin-bottom: 15px;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    label {
      align-self: flex-start;
      margin: 10px 0 5px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: none;
      outline: none;
      margin-bottom: 15px;
      border-radius: 8px;
      background: #012a44;
      color: rgba(33, 138, 55, 0.9);
      font-size: 14px;
      box-shadow: inset 0 0 8px rgb(157, 157, 153);
    }

    input::placeholder {
      color: #d5df6b;
    }

    button {
      width: 100%;
      padding: 12px;
      background: rgb(80, 195, 206);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }
    button:hover {
      background: #d8d5d1;
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(255,255,255,0.4);
    }

    .switch {
      margin-top: 12px;
    }
    .switch a {
      color: rgb(93, 222, 57);
      text-decoration: none;
      font-weight: bold;
    }
    .switch a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 20px;
      font-size: 14px;
      color: #ccc;
    }
    footer a {
      color: #6cf;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- LOGIN BOX -->
    <div class="box" id="loginBox">
      <h2>LOGIN TO YOUR ACCOUNT</h2>
      <!-- redirect to home.html on login -->
      <form onsubmit="event.preventDefault(); window.location.href='rt1.html';">
        <label for="Student Name">Student Name:</label>
        <input id="Student name" type="text" placeholder="Enter Student Name" required>

        <label for="password">Password:</label>
        <input id="password" type="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>
       
      </form>
    
 
      
    </div>

   
    <footer>
      <p><strong>Phone:</strong> +123-456-7890</p>
      <p><strong>Website:</strong> <a href="https://siteracademy.com">www.School Managment.com</a></p>
      <p><strong>Email:</strong> SchoolManag123@gmail.com</p>
      <p><strong>Address:</strong> madapur,hyderbad</p>
    </footer>
  </div>

  <script>
    function toggleForms(form) {
      document.getElementById("loginBox").style.display = 
        (form === "signup") ? "none" : "block";
      document.getElementById("signupBox").style.display = 
        (form === "signup") ? "block" : "none";
    }

    function logout() {
      
      window.location.href = "rt1.html";
    }
  </script>
</body>
</html>
